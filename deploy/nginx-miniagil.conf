server {
    listen 80;
    server_name miniagil.mercurytech.com.br;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name miniagil.mercurytech.com.br;

    ssl_certificate /etc/nginx/certs/letsencrypt/live/miniagil.mercurytech.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/letsencrypt/live/miniagil.mercurytech.com.br/privkey.pem;

    location /api/ {
        proxy_pass http://miniagil-backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://miniagil-backend:4000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://miniagil-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
